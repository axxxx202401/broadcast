<style>
  .logo-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; margin-top:24px; }
  .logo-card { cursor:pointer; border:2px solid var(--border,#d9e2ef); border-radius:20px; padding:18px; background:#fff; transition:.2s ease; }
  .logo-card:hover { transform:translateY(-3px); box-shadow:0 14px 34px rgba(17,68,130,.13); }
  .logo-card.selected { border-color:#178AFF; box-shadow:0 0 0 4px rgba(23,138,255,.12); }
  .logo-stage { min-height:250px; display:flex; align-items:center; justify-content:center; border-radius:16px; background:linear-gradient(145deg,#f7faff,#e8f2ff); }
  .logo-stage svg { width:190px; height:190px; filter:drop-shadow(0 18px 22px rgba(8,64,128,.2)); }
  .logo-card h3 { margin:16px 0 6px; }
  .logo-card p { margin:0; color:#64748b; line-height:1.55; font-size:14px; }
  .badge { display:inline-block; margin-top:12px; padding:4px 9px; border-radius:999px; color:#0f64bd; background:#e7f3ff; font-size:12px; font-weight:700; }
  .sizes { display:flex; align-items:center; gap:14px; margin-top:28px; padding:18px; border-radius:16px; background:#f8fafc; }
  .sizes span { color:#64748b; font-size:13px; }
  .mini { border-radius:22%; box-shadow:0 6px 14px rgba(8,64,128,.2); }
  @media(max-width:900px){.logo-grid{grid-template-columns:1fr}.logo-stage{min-height:220px}}
</style>

<h2>55 群消息广播工具 · Logo 方向</h2>
<p class="subtitle">三个方案都保留 55 App 的蓝底双“5”，区别在于如何表达“监听 → 广播”。点击你最喜欢的方向。</p>

<div class="logo-grid">
  <div class="logo-card card" data-choice="signal" onclick="toggleSelect(this)">
    <div class="logo-stage">
      <svg viewBox="0 0 120 120" role="img" aria-label="双5与广播信号">
        <defs><linearGradient id="a-bg" x1="12" y1="8" x2="108" y2="112" gradientUnits="userSpaceOnUse"><stop stop-color="#2498FF"/><stop offset="1" stop-color="#0864D8"/></linearGradient></defs>
        <rect x="5" y="5" width="110" height="110" rx="28" fill="url(#a-bg)"/>
        <text x="57" y="75" text-anchor="middle" fill="white" font-family="Arial Black,Arial,sans-serif" font-size="58" font-style="italic" font-weight="900" letter-spacing="-11">55</text>
        <circle cx="91" cy="88" r="5" fill="#7EF5D6"/>
        <path d="M91 76a12 12 0 0 1 12 12M91 68a20 20 0 0 1 20 20" fill="none" stroke="#7EF5D6" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <h3>A · 信号角标</h3>
    <p>双“5”保持最强识别度，右下角用节点与两层波纹表达消息向外广播。</p>
    <span class="badge">推荐 · 小尺寸最清晰</span>
  </div>

  <div class="logo-card card" data-choice="radar" onclick="toggleSelect(this)">
    <div class="logo-stage">
      <svg viewBox="0 0 120 120" role="img" aria-label="双5与雷达扫描">
        <defs>
          <linearGradient id="b-bg" x1="10" y1="4" x2="110" y2="116" gradientUnits="userSpaceOnUse"><stop stop-color="#158CFF"/><stop offset="1" stop-color="#073C99"/></linearGradient>
          <linearGradient id="sweep" x1="58" y1="58" x2="105" y2="30" gradientUnits="userSpaceOnUse"><stop stop-color="#7EF5D6" stop-opacity=".7"/><stop offset="1" stop-color="#7EF5D6" stop-opacity="0"/></linearGradient>
        </defs>
        <rect x="5" y="5" width="110" height="110" rx="28" fill="url(#b-bg)"/>
        <circle cx="60" cy="60" r="40" fill="none" stroke="white" stroke-opacity=".18" stroke-width="2"/>
        <circle cx="60" cy="60" r="28" fill="none" stroke="white" stroke-opacity=".15" stroke-width="2"/>
        <path d="M60 60L104 32A52 52 0 0 1 106 82Z" fill="url(#sweep)" opacity=".7"/>
        <path d="M60 60L102 33" stroke="#7EF5D6" stroke-width="2" stroke-linecap="round"/>
        <text x="57" y="76" text-anchor="middle" fill="white" font-family="Arial Black,Arial,sans-serif" font-size="58" font-style="italic" font-weight="900" letter-spacing="-11">55</text>
        <circle cx="91" cy="46" r="4" fill="#7EF5D6"/>
      </svg>
    </div>
    <h3>B · 雷达监听</h3>
    <p>用扫描扇面和目标点强调“持续监控”，技术感更强，广播含义相对含蓄。</p>
    <span class="badge">监控感最强</span>
  </div>

  <div class="logo-card card" data-choice="relay" onclick="toggleSelect(this)">
    <div class="logo-stage">
      <svg viewBox="0 0 120 120" role="img" aria-label="双5与消息中继">
        <defs><linearGradient id="c-bg" x1="8" y1="8" x2="112" y2="112" gradientUnits="userSpaceOnUse"><stop stop-color="#2397FF"/><stop offset="1" stop-color="#0757C2"/></linearGradient></defs>
        <rect x="5" y="5" width="110" height="110" rx="28" fill="url(#c-bg)"/>
        <rect x="18" y="25" width="66" height="60" rx="18" fill="white" fill-opacity=".13" stroke="white" stroke-opacity=".3" stroke-width="2"/>
        <path d="M38 85l-10 10 2-15" fill="white" fill-opacity=".7"/>
        <text x="48" y="70" text-anchor="middle" fill="white" font-family="Arial Black,Arial,sans-serif" font-size="47" font-style="italic" font-weight="900" letter-spacing="-9">55</text>
        <path d="M81 47h10l-5-5m5 5-5 5M86 62h13l-5-5m5 5-5 5M81 77h10l-5-5m5 5-5 5" fill="none" stroke="#7EF5D6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h3>C · 消息中继</h3>
    <p>将双“5”放入消息气泡，右侧箭头表达多路转发，功能含义最直接。</p>
    <span class="badge">广播含义最明确</span>
  </div>
</div>

<div class="sizes">
  <span>推荐方向的小尺寸预览</span>
  <svg class="mini" width="64" height="64" viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#178AFF"/><text x="57" y="76" text-anchor="middle" fill="#fff" font-family="Arial Black,Arial,sans-serif" font-size="58" font-style="italic" font-weight="900" letter-spacing="-11">55</text><circle cx="92" cy="89" r="5" fill="#7EF5D6"/><path d="M92 77a12 12 0 0 1 12 12M92 69a20 20 0 0 1 20 20" fill="none" stroke="#7EF5D6" stroke-width="4" stroke-linecap="round"/></svg>
  <svg class="mini" width="40" height="40" viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#178AFF"/><text x="57" y="76" text-anchor="middle" fill="#fff" font-family="Arial Black,Arial,sans-serif" font-size="58" font-style="italic" font-weight="900" letter-spacing="-11">55</text><circle cx="92" cy="89" r="6" fill="#7EF5D6"/><path d="M92 75a14 14 0 0 1 14 14" fill="none" stroke="#7EF5D6" stroke-width="5" stroke-linecap="round"/></svg>
  <svg class="mini" width="24" height="24" viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#178AFF"/><text x="57" y="76" text-anchor="middle" fill="#fff" font-family="Arial Black,Arial,sans-serif" font-size="58" font-style="italic" font-weight="900" letter-spacing="-11">55</text><circle cx="94" cy="89" r="8" fill="#7EF5D6"/></svg>
</div>
