[package]
name = "im-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints.rust]
missing_docs = "warn"

[dependencies]
im-common = { path = "../im-common" }
im-proto = { path = "../im-proto" }
im-chat = { path = "../im-chat" }
im-store = { path = "../im-store" }
im-http = { path = "../im-http" }
tauri = { workspace = true, features = ["protocol-asset"] }
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
chrono = { workspace = true, features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
futures = "0.3"
base64 = { workspace = true }
prost = { workspace = true }
md-5 = { workspace = true }
hex = { workspace = true }
x25519-dalek = { workspace = true }
rand_core = { workspace = true }
aes = { workspace = true }
cipher = { workspace = true }
reqwest = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
