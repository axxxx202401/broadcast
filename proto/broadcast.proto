syntax = "proto3";

option java_package = "com.im.pb";
option java_outer_classname = "IMPB";

// ========== 枚举 ==========

// 消息内容的协议类型；接收方据此选择文本、媒体、通知或业务消息的解析方式。
enum MessageType {
    // 纯文本消息。
    text = 0;
    // 图片消息。
    image = 1;
    // 音频消息。
    audio = 2;
    // 视频消息。
    video = 3;
    // 位置消息。
    location = 4;
    // 名片消息。
    nameCard = 5;
    // 系统消息。
    system = 6;
    // 文件消息。
    file = 7;
    // 通知消息。
    notice = 8;
    // 动态图片消息。
    dynamicImage = 9;
    // 红包消息。
    redPacket = 10;
    // HTML 消息。
    html = 11;
    // 图片集合消息。
    setImage = 12;
    // 聊天转账消息。
    chatTransfer = 13;
    // 聊天转账结果消息。
    chatTransferResult = 14;
    // 红包结果消息。
    redPacketResult = 15;
    // 第二种 HTML 协议消息。
    html2 = 16;
    // 带说明文字的媒体消息。
    mediasCaption = 17;
    // 动画游戏消息。
    animatedGame = 18;
    // 红包数量变化消息。
    redPacketCountChange = 19;
    // 红包游戏事件消息。
    redPacketGameEvent = 20;
    // 群聊交易消息。
    groupChatTrade = 21;
}

// 客户端运行平台；枚举标识用于生成 API，protobuf wire 使用对应数值。
enum Platform {
    ANDROID = 0;
    IPHONE = 1;
    // 数值 2；保留既有拼写 `UNKOWN` 以维持生成 API 和调用源码兼容。
    UNKOWN = 2;
    MAC = 3;
    WIN = 4;
    HARMONYOS = 5;
}

// 群成员在群内的角色。
enum GroupMemberType {
    // 群主。
    HOST = 0;
    // 管理员。
    MANAGE = 1;
    // 普通成员。
    MEMBER = 2;
}

// 登录账号采用的标识类型。
enum AccountType {
    // 手机号账号。
    MOBILE = 0;
    // 邮箱账号。
    EMAIL = 1;
}

// 登录由用户主动触发还是由系统自动触发。
enum LoginMode {
    // 手动登录。
    HAND = 0;
    // 系统自动登录。
    SYS_AUTO = 1;
}

// 登录所使用的凭据类型。
enum LoginType {
    // 短信验证码。
    SMS_CODE = 0;
    // 密码。
    PASSWORD = 1;
    // 已签发的认证密钥。
    AUTH_KEY = 2;
    // Google 身份令牌。
    GOOGLE_TOKEN = 3;
    // Apple 身份令牌。
    APPLE_TOKEN = 4;
}

// 验证码的业务用途；数值不连续是现有协议的一部分。
enum GetValidateCodeType {
    // 注册。
    REG = 0;
    // 登录。
    LOGIN = 1;
    // 找回密码。
    FIND_PASSWORD = 2;
    // 修改密码。
    UPDATE_PASSWORD = 3;
    // 修改手机号。
    UPDATE_PHONE = 4;
    // 验证密码。
    VALIDATE_PASSWORD = 6;
    // 找回手势密码。
    FIND_GESTURE_PASSWORD = 7;
    // 交易密码验证。
    TRADE_PASSWORD = 8;
    // 修改交易密码。
    UPDATE_TRADE_PASSWORD = 9;
    // 绑定手机号。
    BIND_PHONE = 10;
    // 绑定邮箱。
    BIND_EMAIL = 11;
    // 修改邮箱。
    UPDATE_EMAIL = 12;
    // 验证 Google 验证码。
    VERIFY_GOOGLE_CODE = 19;
    // 绑定账号。
    BIND_ACCOUNT = 20;
    // 验证登录手机号。
    VERIFY_LOGIN_PHONE = 21;
    // 验证登录邮箱。
    VERIFY_LOGIN_EMAIL = 22;
    // 验证登录密码。
    VERIFY_LOGIN_PASSWORD = 23;
}

// 用户对外展示的性别状态。
enum Gender {
    // 不公开。
    SECRECY = 0;
    // 男性。
    MALE = 1;
    // 女性。
    FEMALE = 2;
}

// 文件上传所使用的服务通道。
enum UploadChannelType {
    // 默认 OSS 通道。
    OSS_DEFAULT = 0;
    // 聊天文件 OSS 通道。
    OSS_CHAT = 1;
    // 低速率 OSS 通道。
    OSS_LOW_RATE = 2;
}

// ========== 消息 ==========

// 随请求或长连接登录上报的客户端会话、版本和设备信息。
message ClientInfo {
    // 当前会话标识；未认证请求可以为空。
    string session_id = 1;
    // 应用版本号。
    int32 app_ver = 2;
    // 安装包版本码。
    int32 package_code = 3;
    // 客户端平台。
    Platform plat = 4;
    // 客户端语言编码；具体数值由现有协议约定。
    int32 language = 5;
    // 设备标识。
    string sys_mac = 6;
    // 设备型号。
    string sys_model = 7;
    // 登录后取得的访问令牌；未认证请求可以为空。
    string token = 8;
    // 客户端组合版本字符串。
    string version = 9;
}

// 接口通用结果，承载业务错误码、提示及服务端保留字段。
message CommonResult {
    // 业务错误码。
    int32 err_code = 1;
    // 业务错误说明。
    string err_msg = 2;
    // 服务端返回的结果标记，具体语义由接口约定。
    string flag = 3;
    // 服务端返回的整型字段；具体业务语义由服务端协议约定，当前客户端未验证。
    int32 display = 4;
    // 服务端返回的提示标题。
    string title = 5;
}

// 仅携带客户端信息的通用请求。
message CommonResultReq {
    ClientInfo client_info = 1;
}

// 用户基础资料以及关系、在线状态等关联信息。
message UserBase {
    int64 uid = 1;
    string nick_name = 2;
    string icon = 3;
    Gender gender = 4;
    FriendRelation friend_relation = 5;
    UserOnOrOffLine user_on_or_off_line = 6;
    string signature = 7;
    string depict = 8;
    // 以下 `bf_*` 字段是服务端布尔标记，当前客户端未验证其具体业务语义。
    bool bf_cancel = 9;
    bool bf_banned = 10;
    string identify = 11;
    string real_name = 12;
    string id_number = 13;
    // 服务端时间字段；单位和边界尚未由当前客户端验证，以服务端协议为准。
    int64 create_time = 14;
    int32 user_type = 15;
}

// 当前用户与目标用户的好友关系。
message FriendRelation {
    // 服务端关系布尔标记；具体业务语义尚未由当前客户端验证。
    bool bf_friend = 1;
    // 当前用户为对方设置的备注名。
    string remark_name = 2;
    // 关系状态编码，具体数值由服务端约定。
    int32 status = 3;
}

// 用户在线状态记录。
message UserOnOrOffLine {
    int64 uid = 1;
    bool online = 2;
    // 服务端时间字段；单位和边界尚未由当前客户端验证，以服务端协议为准。
    int64 create_time = 3;
    // 服务端布尔标记；具体业务语义尚未由当前客户端验证。
    bool bf_show = 4;
}

// 群成员资料，将用户信息与其群角色、群昵称和权限关联起来。
message GroupMemberBase {
    UserBase user = 1;
    int64 group_id = 2;
    GroupMemberType type = 3;
    string group_nick_name = 4;
    int64 score = 5;
    // 该成员的管理员权限集合。
    AdminRightBase right = 6;
    // 服务端布尔标记；具体业务语义尚未由当前客户端验证。
    bool bf_my_black = 7;
    // 成员标签类型编码，具体数值由服务端约定。
    int32 label_type = 8;
}

// 群管理员相关的服务端布尔标记集合；当前客户端未验证各字段的具体业务语义。
message AdminRightBase {
    bool bf_update_data = 1;
    bool bf_join_check = 2;
    bool bf_push_notice = 3;
    bool bf_set_admin = 4;
    bool bf_reset_qrcode = 5;
    bool bf_set_join_notice = 6;
    bool bf_set_live = 7;
}

// 群基础资料及服务端下发的群设置；`bf_*` 字段的具体业务语义尚未由当前客户端验证。
message GroupBase {
    // 群唯一标识。
    int64 group_id = 1;
    // 群主用户标识。
    int64 host_id = 2;
    string name = 3;
    string pic = 4;
    bool bf_join_check = 5;
    // 服务端时间字段；单位和边界尚未由当前客户端验证，以服务端协议为准。
    int64 create_time = 6;
    int64 member_count = 7;
    bool bf_join_friend = 8;
    bool bf_shutup = 9;
    bool bf_group_read_cancel = 10;
    // 服务端时限字段；单位和边界尚未由当前客户端验证，以服务端协议为准。
    int32 group_msg_cancel_time = 11;
    bool bf_banned = 12;
    string group_alias_name = 13;
    string remark = 14;
    int32 max_member_count = 15;
    bool bf_join_notice = 16;
    string notice = 17;
}

// 获取当前用户群联系人列表的请求。
message GroupContactListReq {
    ClientInfo client_info = 1;
}

// 群联系人列表响应。
message GroupContactListResp {
    // 通用业务结果。
    CommonResult common_result = 1;
    // 服务端报告的群数量。
    int32 group_count = 2;
    // 群资料列表。
    repeated GroupBase groups = 3;
}

// 建立聊天长连接时发送的登录会话消息。
message LoginSessionMessage {
    // 客户端信息；保留服务端既有拼写 `clinet_info` 以维持生成 API 和调用代码兼容。
    // protobuf wire 兼容由字段号和类型决定。
    ClientInfo clinet_info = 1;
    // 服务端时间字段；单位和边界尚未由当前客户端验证，以服务端协议为准。
    int64 latest_login_time = 2;
    // 安装标识；当前客户端使用设备标识填充。
    string install_code = 3;
    // 推送标签编码；具体数值语义由服务端约定。
    int32 push_tag = 4;
}

// 会话使用的密钥材料及其版本。
message KeyPairBase {
    string public_key = 1;
    string private_key = 2;
    string msg_key = 3;
    int32 key_version = 4;
}

// 长连接登录成功后服务端推送的会话密钥信息。
message PushLoginSuccessMessage {
    // 服务端时间字段；单位和边界尚未由当前客户端验证，以服务端协议为准。
    int64 login_time = 1;
    // 用户端密钥材料。
    KeyPairBase user_key_pair = 2;
    // Web 端密钥材料。
    KeyPairBase web_key_pair = 3;
    // 服务端布尔标记；具体业务语义尚未由当前客户端验证。
    bool bf_web_online = 4;
}

// 一条群聊消息及其发送者、内容、版本和附件元数据。
message GroupMessage {
    int64 send_uid = 1;
    int64 group_id = 2;
    MessageType msg_type = 3;
    // 按 `msg_type` 对应格式编码的消息正文。
    bytes content = 4;
    // 被 @ 的用户标识列表。
    repeated int64 at_uids = 6;
    // 服务端时间字段；单位和边界尚未由当前客户端验证，以服务端协议为准。
    int64 send_time = 7;
    int64 msg_id = 8;
    GroupMemberBase send_member = 9;
    int32 version = 10;
    // 消息内容摘要。
    string content_md5 = 11;
    // 附件关联键；具体业务语义由服务端协议约定。
    string attachment_key = 12;
    string group_name = 13;
    // 服务端时限字段；单位和边界尚未由当前客户端验证，以服务端协议为准。
    int32 snapchat_time = 14;
    repeated AtUser at_users = 15;
    // 上传通道。
    UploadChannelType channel_type = 16;
    // 消息来源编码，具体数值由服务端约定。
    int32 msg_from = 17;
    // 服务端整型字段；具体业务语义尚未由当前客户端验证。
    int32 edit = 18;
    // 正文中的链接位置记录。
    repeated LinkObj links = 19;
    // 服务端保留的时间字段，当前客户端不解释其单位和语义。
    int64 sent_over_time = 20;
    // 服务端布尔标记；具体业务语义尚未由当前客户端验证。
    bool is_hide = 21;
}

// 群消息中被 @ 用户的展示资料。
message AtUser {
    int64 uid = 1;
    string nick_name = 2;
    FriendRelation friend_relation = 5;
}

// 正文链接及服务端返回的位置相关字段。
message LinkObj {
    string link = 1;
    // 链接偏移；偏移单位和有效边界尚未由当前客户端验证，以服务端协议为准。
    int32 location = 2;
    // 链接范围长度；长度单位和有效边界尚未由当前客户端验证，以服务端协议为准。
    int32 length = 3;
}

// 服务端批量推送的群消息与各群未读数。
message PushGroupMessage {
    // 群消息列表。
    repeated GroupMessage group_msg = 1;
    // 以群标识为键的未读数量。
    map<int64, int32> unread_count_map = 2;
}

// 客户端确认已接收一批群消息的回执。
message ReceiveGroupMessage {
    // 已接收的消息标识列表。
    repeated int64 msg_id = 1;
    // 这些消息所属的群。
    int64 group_id = 2;
}

// 群消息撤回事件，保留原消息与操作人的必要信息。
message RecallMessage {
    int64 msg_id = 1;
    int64 send_uid = 2;
    int64 group_id = 3;
    // 服务端时间字段；单位和边界尚未由当前客户端验证，以服务端协议为准。
    int64 send_time = 4;
    int32 operator_uid = 5;
    MessageType msg_type = 6;
    string operator_name = 7;
    string content = 8;
    int32 version = 9;
    string content_md5 = 10;
    string attachment_key = 11;
    string group_name = 12;
}

// ========== 登录相关 ==========

// 登录请求，可携带客户端信息与多种凭据字段；字段组合由服务端登录协议约定。
message LoginReq {
    ClientInfo client_info = 1;
    string country_code = 2;
    string phone = 3;
    LoginMode login_mode = 4;
    LoginType login_type = 5;
    // 验证码用途；需要验证码的登录流程使用。
    GetValidateCodeType type = 6;
    string sms_code = 7;
    string password = 8;
    string sys_version = 9;
    string sys_model = 10;
    string sys_mac = 11;
    string token = 12;
    string device_token = 13;
    string device_info = 14;
    AccountType account_type = 15;
    string auth_key = 16;
    // 第三方登录身份令牌。
    string id_token = 17;
    // 客户端提交的公钥。
    string public_key = 18;
    // 协议保留密钥字段，具体用途由登录服务约定。
    string official_key = 19;
    // 备用设备标识。
    string second_mac = 20;
}

// 登录响应，返回用户、会话、服务地址以及服务端保留字段。
message LoginResp {
    CommonResult common_result = 1;
    UserBase user = 2;
    string session_id = 3;
    // 服务端整型字段；具体业务语义尚未由当前客户端验证。
    int32 review_model = 4;
    // 后续业务与长连接服务地址。
    UrlInfo urls = 5;
    // 服务端布尔标记；具体业务语义尚未由当前客户端验证。
    bool login_reg = 6;
    // 服务端时间字段；单位和边界尚未由当前客户端验证，以服务端协议为准。
    int64 server_time = 7;
    string token = 8;
    string invite_code = 9;
    int32 privacy = 10;
    // 服务端时间字段；单位和边界尚未由当前客户端验证，以服务端协议为准。
    int64 disable_time = 11;
    string agora_app_id = 12;
    // 上传文件大小相关数值；单位和边界尚未由当前客户端验证，以服务端协议为准。
    int64 upload_file_size = 13;
    // 上传图片大小相关数值；单位和边界尚未由当前客户端验证，以服务端协议为准。
    int64 upload_image_size = 14;
    // 服务端整型状态；具体业务语义尚未由当前客户端验证。
    int32 need_reset_password = 15;
    int32 key_version = 16;
    // 服务端时限字段；单位和边界尚未由当前客户端验证，以服务端协议为准。
    int32 shoot_time_limit = 17;
    // 服务端布尔标记；具体业务语义尚未由当前客户端验证。
    bool remind_change_password = 18;
    // 上传身份图片大小相关数值；单位和边界尚未由当前客户端验证，以服务端协议为准。
    int64 upload_id_img_size = 19;
    // 服务端布尔标记；具体业务语义尚未由当前客户端验证。
    bool is_not_last_device_mac = 20;
}

// 登录后使用的业务、静态资源、上传及 WebSocket 服务地址集合。
message UrlInfo {
    string biz = 1;
    string session = 2;
    string friend = 3;
    string group = 4;
    string static_map = 5;
    string download = 6;
    string login = 7;
    string config = 8;
    string wss = 9;
    // Socket 协议编码，具体数值由服务端约定。
    int32 socket_protocol = 10;
    // 上传服务编码，具体数值由服务端约定。
    int32 upload_server = 11;
    string upload_url = 12;
    string wallet_url = 13;
    string news_url = 14;
    string otc_url = 15;
    string red_packet_url = 16;
    string payment_url = 17;
}

// 长连接返回的协议错误；保留既有拼写 `ErrrMessage` 以维持生成 API 和调用源码兼容。
// protobuf wire 由消息字段号和类型决定。
message ErrrMessage {
    // 协议错误码。
    int64 error_msg_code = 1;
    // 协议错误说明。
    string error_msg = 2;
    // 服务端错误标记，具体语义由协议约定。
    int64 flag = 3;
    // 错误关联的目标标识。
    int64 target_id = 4;
    // 触发错误的消息协议标识。
    int32 message_protocol_id = 5;
}
