name: Build desktop bundles

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Build environment
        required: true
        default: test
        type: choice
        options:
          - test
          - production
      platform:
        description: Build platform (all = Windows + macOS + Linux)
        required: false
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

permissions:
  contents: read

# 将 env 提高到顶层，解决 Job 级别读取不到 secrets 的问题
env:
  IM_OPENCHAT_USER_URL: ${{ secrets.IM_OPENCHAT_USER_URL }}
  IM_BIZ_URL: ${{ secrets.IM_BIZ_URL }}
  IM_CHAT_HOST: ${{ secrets.IM_CHAT_HOST }}
  IM_CHAT_PORT: ${{ secrets.IM_CHAT_PORT }}
  IM_VERSION_SECRET_NAME: ${{ secrets.IM_VERSION_SECRET_NAME }}
  IM_BODY_AES_KEY: ${{ secrets.IM_BODY_AES_KEY }}
  IM_HEADER_AES_KEY: ${{ secrets.IM_HEADER_AES_KEY }}
  IM_APP_VER: ${{ secrets.IM_APP_VER }}
  IM_PACKAGE_CODE: ${{ secrets.IM_PACKAGE_CODE }}
  IM_PLAT: ${{ secrets.IM_PLAT }}
  IM_LANGUAGE: ${{ secrets.IM_LANGUAGE }}
  IM_SYS_MODEL: ${{ secrets.IM_SYS_MODEL }}
  VITE_GT4_CAPTCHA_ID: ${{ secrets.VITE_GT4_CAPTCHA_ID }}

jobs:
  # ================= Windows Build =================
  build-windows:
    name: ${{ inputs.environment }} / windows-x86_64
    runs-on: windows-latest
    if: inputs.platform == 'all' || inputs.platform == 'windows'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # 使用 100% 兼容 Windows 的 protoc 安装方式
      - name: Install protoc (Windows)
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            im-app/package-lock.json
            im-app/ui/package-lock.json

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install application dependencies
        working-directory: im-app
        run: npm ci

      - name: Install UI dependencies
        working-directory: im-app/ui
        run: npm ci

      - name: Build Tauri bundles
        working-directory: im-app
        run: npm run build:${{ inputs.environment }} -- --target x86_64-pc-windows-msvc

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: im-monitor-${{ inputs.environment }}-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 14

  # ================= macOS Build =================
  build-macos:
    name: ${{ inputs.environment }} / ${{ matrix.label }}
    runs-on: macos-latest
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-x86_64
            target: x86_64-apple-darwin
          - label: macos-arm64
            target: aarch64-apple-darwin

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install protoc (macOS)
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            im-app/package-lock.json
            im-app/ui/package-lock.json

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install application dependencies
        working-directory: im-app
        run: npm ci

      - name: Install UI dependencies
        working-directory: im-app/ui
        run: npm ci

      - name: Build Tauri bundles
        working-directory: im-app
        run: npm run build:${{ inputs.environment }} -- --target ${{ matrix.target }}

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: im-monitor-${{ inputs.environment }}-${{ matrix.label }}
          path: target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 14

  # ================= Linux Build =================
  build-linux:
    name: ${{ inputs.environment }} / linux-x86_64
    runs-on: ubuntu-22.04
    if: inputs.platform == 'all' || inputs.platform == 'linux'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install protoc (Linux)
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"

      - name: Install Linux system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            im-app/package-lock.json
            im-app/ui/package-lock.json

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install application dependencies
        working-directory: im-app
        run: npm ci

      - name: Install UI dependencies
        working-directory: im-app/ui
        run: npm ci

      - name: Build Tauri bundles
        working-directory: im-app
        run: npm run build:${{ inputs.environment }} -- --target x86_64-unknown-linux-gnu

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: im-monitor-${{ inputs.environment }}-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 14